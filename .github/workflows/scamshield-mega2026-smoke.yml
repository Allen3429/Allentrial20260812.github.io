name: ScamShield MEGA 2026 smoke test

on:
  push:
    branches: [main]
    paths:
      - "scamshield-mega2026/**"
      - ".github/workflows/scamshield-mega2026-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check scamshield-mega2026/product-lite.js
          node --check scamshield-mega2026/director.js
          node --check scamshield-mega2026/campaign-data.js
      - name: Validate competition product contract
        run: node scamshield-mega2026/tests/smoke.mjs
      - name: Confirm original ScamShield was not imported as runtime
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const html = fs.readFileSync('scamshield-mega2026/index.html', 'utf8');
          const imports = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map(m => m[1]);
          const bad = imports.filter(value => value.startsWith('../scamshield/') && value !== '../scamshield/');
          if (bad.length) {
            console.error('MEGA site imports original runtime assets:', bad);
            process.exit(1);
          }
          console.log('MEGA runtime is self-contained; the only original-site reference is a navigation link.');
          EOF
