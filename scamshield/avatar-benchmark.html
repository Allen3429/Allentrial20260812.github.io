<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="./product-config.js?v=2.1.0"></script><script type="module" src="https://cdn.perxona.ai/asia/prod/latest/widget/entry/presenter.js"></script><style>html,body{margin:0;background:#05070b;color:#fff;font-family:system-ui}sv-presenter{display:block;width:640px;height:480px}</style></head><body><sv-presenter id="p"></sv-presenter><pre id="out">boot</pre><script type="module">
const cfg=window.SCAMSHIELD_CONFIG; const out=document.querySelector('#out'); const p=document.querySelector('#p');
const q=new URLSearchParams(location.search); const requested=q.get('avatar')||''; const t0=performance.now();
const api=async(path)=>{const r=await fetch(cfg.apiBase+path,{headers:{'X-Connect-Key':cfg.publishableConnectKey},cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
const id=(kind,x)=>kind==='avatar'?(x.avatar_id||x.id):kind==='scene'?(x.scene_id||x.id):(x.id||x.voice_id);
try{await customElements.whenDefined('sv-presenter'); const [A,S,V]=await Promise.all([api('/api/v1/connect/assets/avatars?page=1&size=100'),api('/api/v1/connect/assets/scenes?page=1&size=20'),api('/api/v1/connect/voices?page=1&size=20')]); const av=(A.items||[]).find(x=>id('avatar',x)===requested)||(A.items||[])[0]; const sc=(S.items||[])[0]; const vo=(V.items||[])[0]; if(!av||!sc||!vo)throw new Error('missing asset'); const target={avatarId:id('avatar',av),sceneId:id('scene',sc),voiceId:id('voice',vo)}; const ready=new Promise((res,rej)=>{const timer=setTimeout(()=>rej(new Error('timeout')),45000); p.addEventListener('PRESENTER_STATUS',e=>{if(e.detail?.status==='Ready'){clearTimeout(timer);res()}},{once:false})}); p.initializeWithConnectKey(cfg.publishableConnectKey,target).catch(()=>{}); await ready; const ms=Math.round(performance.now()-t0); const result={ok:true,avatarId:target.avatarId,ms}; window.__BENCH_RESULT=result; out.textContent=JSON.stringify(result); document.title='BENCH_OK_'+ms;}catch(e){const result={ok:false,error:String(e?.message||e),ms:Math.round(performance.now()-t0)};window.__BENCH_RESULT=result;out.textContent=JSON.stringify(result);document.title='BENCH_FAIL';}
</script></body></html>
